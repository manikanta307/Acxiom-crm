{% extends 'base.html' %}
{% block content %}
<h2>Customers</h2>
<a class="btn btn-primary mb-3" href="{{ url_for('customers.create_customer') }}">Create Customer</a>
<form method="get" class="mb-3">
  <div class="input-group">
    <input name="q" class="form-control" placeholder="Search customers..." value="{{ request.args.get('q','') }}">
    <button class="btn btn-outline-secondary" type="submit">Search</button>
  </div>
<form>

<div class="list-group">
  {% for c in customers %}
  <a class="list-group-item list-group-item-action" href="{{ url_for('customers.customer_detail', cid=c.id) }}">{{ c.name }}{% if c.email %} — {{ c.email }}{% endif %}</a>
  {% else %}
  <div class="list-group-item">No customers found.</div>
  {% endfor %}
</div>

{% endblock %}
